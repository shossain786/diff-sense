<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1280px;height:600px;overflow:hidden;font-family:"Ubuntu","Noto Sans",sans-serif;color:#e8edf5;
    background:radial-gradient(900px 500px at 85% -10%,#2a4a7f55,transparent 60%),linear-gradient(160deg,#0f1626,#182030 60%,#131b2b);
    display:flex;flex-direction:column;align-items:center;padding:34px 0 0}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:92px;height:92px;filter:drop-shadow(0 6px 24px #3b82f688)}
  h1{font-size:64px;font-weight:700;letter-spacing:-1px;line-height:1}
  h1 span{color:#60a5fa}
  .tag{font-size:28px;margin-top:8px;color:#c7d2e4}
  .chips{display:flex;gap:10px;margin-top:20px}
  .chip{font-size:15px;padding:6px 14px;border:1px solid #33425f;border-radius:999px;color:#a9b8d0;background:#ffffff08}
  .shot{margin-top:30px;width:1120px;border-radius:14px 14px 0 0;overflow:hidden;border:1px solid #3a4a68;border-bottom:0;
    box-shadow:0 30px 80px #000a,0 0 0 1px #0006}
  .shot img{display:block;width:100%}
</style></head><body>
  <div class="brand"><img src="logo-512.png"><h1>Diff<span>Sense</span></h1></div>
  <div class="tag">Compare files. Understand what changed.</div>
  <div class="chips">
    <div class="chip">JSON</div><div class="chip">YAML</div><div class="chip">XML</div>
    <div class="chip">Java &amp; test automation</div><div class="chip">API responses</div>
    <div class="chip">100% local</div>
  </div>
  <div class="shot"><img src="screenshot-java.png"></div>
</body></html>
